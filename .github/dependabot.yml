version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    target-branch: 'main'
    allow:
      - dependency-type: 'direct'
    commit-message:
      prefix: 'dependabot github-actions update'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'github actions'
    groups:
      github-actions-dependencies:
        applies-to: 'version-updates'
        patterns:
          - '*'
      github-actions-dependencies-security:
        applies-to: 'security-updates'
        patterns:
          - '*'

  - package-ecosystem: 'bundler'
    directory: '/docs'
    schedule:
      interval: 'monthly'
    target-branch: 'main'
    allow:
      - dependency-type: 'direct'
    commit-message:
      prefix: 'dependabot bundler update'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'ruby'
    groups:
      ruby-dependencies:
        applies-to: 'version-updates'
        patterns:
          - '*'
      ruby-dependencies-security:
        applies-to: 'security-updates'
        patterns:
          - '*'
